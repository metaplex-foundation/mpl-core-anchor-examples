[package]
description = "Created with Anchor"
edition = "2021"
name = "mpl-core-anchor-wrapper"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "mpl_core_anchor_wrapper"

[features]
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = "0.32.1"
borsh = "1.6.1"
mpl-core = { git = "https://github.com/metaplex-foundation/mpl-core.git", branch = "feat/anchor0-32-1", features = [
  "anchor",
  "anchor-0-32",
] }
num-derive = "0.4.2"
num-traits = "0.2.18"
